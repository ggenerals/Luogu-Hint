<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hint-Luogu - 洛谷题目提示系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Hint-Luogu</h1>
            <p class="subtitle">洛谷题目提示系统 - 独立思考，循序渐进</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入题号（如 P1000）或题目名称..." autocomplete="off">
            <button id="searchBtn">搜索</button>
        </div>

        <div class="stats" id="stats">
            <!-- 统计信息将在这里显示 -->
        </div>

        <div id="results" class="results">
            <!-- 搜索结果将在这里显示 -->
        </div>
    </div>

    <footer>
        <p>
            数据来源：<a href="https://www.luogu.com.cn" target="_blank">洛谷</a> | 
            <a href="https://github.com/UniGravityqwq/hint-luogu" target="_blank">GitHub</a>
        </p>
        <p class="disclaimer">本项目仅提供学习提示，请独立完成题目</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
